# Committed template. Copy to config.yaml for local overrides (git-ignored).
# No secrets or personal data belong in this file — email addresses and the S3
# bucket are read from environment variables named by the *_env_var keys below.

# v2 context layers. All default false so v1 behaviour needs no extra keys/network.
features:
  earnings_guard: false   # Phase 1: cap action near scheduled earnings
  macro_overlay: false    # Phase 2: tilt scores by macro regime
  news_sentiment: false   # Phase 3: tilt + context from news (needs ANTHROPIC_API_KEY)

watchlist:
  # Speculative AI / software
  - PLTR
  - TEM
  - SOUN
  - AI
  - BBAI
  - PATH
  - UPST
  - CRWV
  # Memory & storage (AI memory supercycle)
  - MU
  - SNDK
  - STX
  - WDC
  - LRCX
  # AI infrastructure (picks & shovels)
  - NVDA
  - ALAB
  - CRDO
  - VRT
  - ANET
  - CLS
  # Space. SPCX listed 2026-06-12, so until mid-2027 it has no 200-day MA (two
  # components score a neutral 0.5) and its "52-week high" is the IPO spike.
  # Read its score as unreliable until it has ~252 sessions of history.
  - SPCX

# Index/ETF rows shown for comparison. They are fetched and scored like anything
# else, but never ranked — otherwise SPY and QQQ would quietly take slots in the
# flagged set, since a broad index almost always outscores a single volatile name.
benchmarks:
  - QQQ
  - SPY
  - SMH

data:
  # How much daily history to pull. This must cover lookback_days plus
  # scoring.smoothing_days, so that every session in the smoothing window still
  # gets a full 52-week lookback of its own.
  history_period: "18mo"
  # Sessions each day's metrics and score are computed over (~52 weeks). Kept
  # separate from history_period so extra fetched history never leaks into the
  # "52-week high".
  lookback_days: 252
  # Minimum sessions before a ticker can be ranked. Under this, compute_metrics
  # cannot form a 200-day average and the score falls back to neutral
  # placeholders — a six-session-old listing scores ~50 on no information, which
  # under rank selection is enough to take a portfolio slot. Such names are still
  # shown, tagged NOT ENOUGH HISTORY, so you can watch them season.
  min_sessions: 200

scoring:
  # Average the score over this many trailing sessions before ranking on it.
  # The score's predictive power peaks near a 3-month horizon, so acting on the
  # raw daily value mostly trades noise. Set to 1 for the old daily behaviour.
  smoothing_days: 40
  # How the score becomes an action tier.
  #   rank      -> the best top_n setups on offer are the portfolio (recommended)
  #   threshold -> the v1 behaviour: compare each score against the cutoffs below
  # Rank mode keeps the flagged set the same size every day. Threshold mode lets
  # a market-wide drawdown empty the report out, which is when it goes to cash
  # at the bottom.
  selection:
    mode: rank
    top_n: 8     # names that make up the portfolio
    bench_n: 3   # next-best names, flagged STARTER (first to rotate in)
  thresholds:
    # Used verbatim in threshold mode. In rank mode only `watch` is used, as the
    # floor below which a name is called AVOID rather than WATCH.
    add: 80      # >= add        -> ADD SIGNAL
    starter: 65  # >= starter    -> STARTER SIGNAL
    watch: 50    # >= watch      -> WATCH ; below -> AVOID FOR NOW
  # Weights sum to 100 so the score lands in 0..100.
  # Momentum is deliberately 0: measured on its own against forward returns its
  # rank IC is +0.019 (t=2.4), i.e. barely distinguishable from noise, and it
  # mostly ejects you from names that are moving. Zeroing it and redistributing
  # its 20 points raised the 21-session IC from +0.091 to +0.103 and cut
  # annualised turnover from ~970% to ~735%. Restore it to 20 (and drop the
  # others back to 25/15/15/25) for the v1 behaviour.
  weights:
    long_term_trend: 32   # price vs 200-day MA
    medium_term_trend: 18 # price vs 50-day MA
    trend_structure: 18   # 50-day MA vs 200-day MA (golden-cross posture)
    pullback: 32          # healthy dip off the 52-week high
    momentum: 0           # see above
  pullback:
    # "% below 52-week high" band that earns full pullback credit.
    ideal_min: 8
    ideal_max: 20
    # More than this far below the high => treated as a broken setup (~0 credit).
    # 45 was a cliff, not a ramp: on 2026-06-26 PLTR sat 45.5% below its high, so
    # every component pinned at zero and it scored 0.0 — then rose 62%. 60 keeps
    # the "broken setup" idea while giving deep drawdowns a gradient.
    broken_below: 60
  momentum:
    # 5-day % move beyond this magnitude scores 0 (too hot or falling knife).
    tolerance_pct: 12
  # Caps for the v2 overlays. The technical base (0..100) stays dominant: the
  # most the context layers can move a score is +/- (macro_max + sentiment_max).
  tilts:
    macro_max: 8
    sentiment_max: 10

# Phase 1: earnings guard.
earnings:
  guard_window_days: 5   # a name reporting within N days is capped at WATCH

# Phase 2: macro / theme overlay.
# themes map tickers to themes; macro.regimes detect a regime from a proxy
# series and tilt every ticker belonging to the affected theme(s).
themes:
  ai_memory: [MU, SNDK, STX, WDC, LRCX]
  ai_infra: [ALAB, CRDO, VRT, ANET, CLS, SMH, NVDA]
  energy: [XLE, XOM, OXY, CVX]
  defense: [LMT, RTX, NOC]

macro:
  history_period: "3mo"   # how much macro history to pull for lookbacks
  regimes:
    - name: energy_tailwind
      series: "CL=F"        # crude oil futures
      lookback_days: 20
      change_pct: 10        # up >= 10% over the lookback
      direction: up
      themes: [energy]
      tilt: 8
      tag: "Energy regime"
    - name: risk_off
      series: "^VIX"        # volatility index
      lookback_days: 10
      change_pct: 30
      direction: up
      themes: ["*"]         # applies to every ticker
      tilt: -6
      tag: "Risk-off (VIX spike)"

# Phase 3: news + sentiment.
news:
  max_headlines: 8
  model: "claude-haiku-4-5"   # cheap, high-volume classification
  # Key resolution order: SSM SecureString (named by the env var below) first,
  # then the plain env var for local dev.
  api_key_ssm_param_env_var: ANTHROPIC_API_KEY_SSM_PARAM
  api_key_env_var: ANTHROPIC_API_KEY

report:
  title: "AI Stock Watch — Daily Signal Report"
  email_enabled: false       # set true to actually send via SES
  recipient_env_var: REPORT_RECIPIENT
  sender_env_var: REPORT_SENDER
  save_to_s3: false
  s3_bucket_env_var: REPORT_BUCKET
  # Optional link at the foot of the email, pointing at the full record.
  # A personal URL, so it lives in the environment rather than this file.
  dashboard_url_env_var: DASHBOARD_URL

disclaimer: >
  This report is generated by a rules-based script for educational and personal
  research purposes only. It is not financial advice or a recommendation to buy
  or sell any security.
