name: Evaluate

# Two jobs that nothing else does: score the live record, and republish the
# dashboard. The scoring is the slow question — it resolves over years, not
# weeks — but the page has to be rebuilt often or it silently shows stale
# numbers under a current-looking heading, which is worse than not publishing
# it at all. So this runs after each weekday close.
on:
  schedule:
    # Daily at 23:15 UTC, an hour after the 22:00 run, so the published page is
    # never more than a day behind. The weekly scoring summary rides along.
    - cron: "15 23 * * MON-FRI"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check credentials are configured
        id: preflight
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "AWS_DEPLOY_ROLE_ARN is not set — skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assume the role
        if: steps.preflight.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: pip install -r requirements.txt boto3

      - name: Score the live record
        if: steps.preflight.outputs.ready == 'true'
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ai-stock-watch \
            --query 'Stacks[0].Outputs[?OutputKey==`ReportBucketName`].OutputValue' \
            --output text)
          echo "## Live signal record" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Only the live population. Backfilled rows restate what today's rules
          # would have said on a watchlist chosen knowing the outcomes, so
          # pooling them here would quietly flatter the result.
          python scripts/evaluate_snapshots.py \
            --bucket "$BUCKET" --source live --horizons 5,21 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the dashboard
        if: steps.preflight.outputs.ready == 'true'
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ai-stock-watch \
            --query 'Stacks[0].Outputs[?OutputKey==`ReportBucketName`].OutputValue' \
            --output text)
          # The dashboard stack may not exist yet; publishing still works
          # without it, the page simply is not being served anywhere.
          DIST=$(aws cloudformation describe-stacks \
            --stack-name ai-stock-watch-dashboard \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text 2>/dev/null || true)
          if [ -n "$DIST" ] && [ "$DIST" != "None" ]; then
            python scripts/publish_dashboard.py --bucket "$BUCKET" \
              --out-file dashboard.html --invalidate --distribution-id "$DIST"
          else
            python scripts/publish_dashboard.py --bucket "$BUCKET" --out-file dashboard.html
          fi

      - name: Keep the rendered page
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.html
          retention-days: 90
